[project]
name = "apex-api"
version = "0.1.0"
description = "Apex — API et worker du studio photo motorsport (Studio Chicane)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    # `bcrypt` en direct, pas `passlib[bcrypt]` (§3-I) : `passlib==1.7.4` sonde
    # `bcrypt.__about__.__version__`, retiré depuis `bcrypt>=4.1` — casse *avant* de
    # hacher (`AttributeError` puis `ValueError` trompeur), reproduit en conditions
    # réelles. Voir `apex/security.py` pour le détail de l'écart.
    "bcrypt>=4.1",
    "boto3>=1.35",
    "pillow>=10.4",
    "numpy>=2.1",
    "piexif>=1.1",
    "zipstream-ng>=1.8",
    "rapidocr-onnxruntime>=1.3",
    "typer>=0.13",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "faker>=30.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apex"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (Query/File/Depends/Security/... in argument
# defaults) is idiomatic, pas un piège à effet de bord mutable — B008 doit l'ignorer.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "ocr_eval: évaluation OCR offline sur jeu synthétique (J2, hors suite par défaut)",
]
addopts = "-m 'not ocr_eval'"

[tool.coverage.run]
source = ["src/apex/pipeline", "src/apex/queue", "src/apex/services"]
