[project]
name = "apex-api"
version = "0.1.0"
description = "Apex — API et worker du studio photo motorsport (Studio Chicane)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    # Sans l'extra `[standard]` (uvloop, httptools, websockets, watchfiles, pyyaml) :
    # ~50 Mo à eux quatre, jamais exécutés en production — Vercel invoque l'objet `app`
    # directement (`api/index.py`), le serveur ASGI d'uvicorn ne tourne jamais en
    # serverless. L'extra reste nécessaire en local (`uv run uvicorn ... --reload`),
    # couvert par le groupe `dev` ci-dessous.
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Sans l'extra `[cryptography]` (~16 Mo) : le JWT du projet est HS256 exclusivement
    # (`apex/security.py`), qui ne requiert aucun backend asymétrique — `python-jose` le
    # supporte nativement sans dépendance supplémentaire (vérifié : `jwt.encode`/`decode`
    # HS256 fonctionnent sans `cryptography` installé).
    "python-jose>=3.3",
    # `bcrypt` en direct, pas `passlib[bcrypt]` (§3-I) : `passlib==1.7.4` sonde
    # `bcrypt.__about__.__version__`, retiré depuis `bcrypt>=4.1` — casse *avant* de
    # hacher (`AttributeError` puis `ValueError` trompeur), reproduit en conditions
    # réelles. Voir `apex/security.py` pour le détail de l'écart.
    "bcrypt>=4.1",
    "boto3>=1.35",
    "pillow>=10.4",
    "numpy>=2.1",
    "piexif>=1.1",
    "zipstream-ng>=1.8",
    "typer>=0.13",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    # Générateur de jeu de démo (J2, §3-N.1) : tourne à l'exécution — `POST /demo/seed`,
    # `apex.cli seed --reset`, cron nocturne (J3) — donc dépendance d'exécution, pas de dev
    # (déplacé du groupe `dev` : la démo *est* l'application, pas seulement ses tests).
    "faker>=30.8",
]

[project.optional-dependencies]
# Moteur OCR, dépendance **optionnelle** (§ Décision « Option 2 », docs/wiki/architecture.md,
# « Le moteur OCR devient une dépendance optionnelle ») : `rapidocr-onnxruntime` et sa
# fermeture (`opencv-python-headless`, `onnxruntime`, `shapely`, `pyclipper`) pèsent à eux
# seuls ~322 Mo décompressés, mesuré — plus que le plafond entier d'une fonction Vercel
# Python (250 Mo). Absent de `requirements.txt` (`uv export --no-dev`, sans `--extra ocr`) :
# la fonction déployée ne l'installe jamais. Nécessaire partout où `ocr_media` doit
# réellement s'exécuter : poste de développement (`uv sync --extra ocr`, désormais la
# commande standard, voir AGENTS.md) et tout poste faisant tourner
# `apex.cli worker --loop` en conditions réelles.
ocr = [
    "rapidocr-onnxruntime>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    # Extra de confort pour `uv run uvicorn apex.main:app --reload` en local (rechargement
    # à chaud, meilleures perfs de dev) — jamais exécuté en production, voir plus haut.
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apex"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (Query/File/Depends/Security/... in argument
# defaults) is idiomatic, pas un piège à effet de bord mutable — B008 doit l'ignorer.
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "ocr_eval: évaluation OCR offline sur jeu synthétique (J2, hors suite par défaut)",
]
addopts = "-m 'not ocr_eval'"

[tool.coverage.run]
source = ["src/apex/pipeline", "src/apex/queue", "src/apex/services"]
